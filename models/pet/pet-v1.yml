repo: https://github.com/lab-cosmo/pet-mad
preprint: https://arxiv.org/abs/2503.14118
checkpoint_url: https://huggingface.co/lab-cosmo/pet-mad/resolve/b0234f3/models/pet-mad-latest.ckpt

openness: OSOD
train_task: S2EF
test_task: S2EF
targets: EFS_G
model_type: Transformer
model_params: 733_000_000
trained_for_benchmark: true
n_estimators: 1

license:
  code: BSD-3-Clause
  code_url: https://github.com/metatensor/metatrain/blob/main/LICENSE

hyperparams:
  d_pet: 640
  d_node: 2560
  d_feedforward: 1280
  d_head: 640
  num_gnn_layers: 5
  num_attention_layers: 3
  cutoff: 10.0
  num_neighbors_adaptive: 40
  cutoff_width: 0.5
  cutoff_function: Bump

training_cost:
  Nvidia H100 GPUs: {amount: 512, hours: 40}

requirements:
  metatomic-torch: 0.1.7

training_set: [OMat24, sAlex, MPtrj]

